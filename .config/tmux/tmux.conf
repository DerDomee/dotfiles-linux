set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Rebind leader prefix from CTRL+B to CTRL+Y
unbind C-b
set -g prefix C-y
bind C-y send-prefix

#Enable TrueColor inside my terminal emulator of choice: st
set -ga terminal-overrides ",st-256color:Tc"

# Status line on top
set -g status on
set-option -g status-position top

bind-key C-q run-shell 'CURRENT=$(tmux display-message -p "#S"); \
  if [ "$CURRENT" = "main" ]; then \
    tmux detach-client; \
  else \
    tmux switch-client -t main \; kill-session -t "$CURRENT"; \
  fi'

# Ability to reload config while tmux is running
bind r source-file ~/.config/tmux/tmux.conf

# Set hook on deattaching from a session, deleting the session if
# no other clients are attached and no processes are running inside.
set-hook -g client-detached "run-shell '~/.config/tmux/auto-kill-session.sh main'"


# ################# #
# Sensible Settings #
# ################# #

# enable mouse scrolling support
set -g mouse on

# adress vim mode switching delay, shorten it with this option
set -s escape-time 0

# increase scrollback buffer
set -g history-limit 50000

# set tmux-command feedback time to 4 seconds
set -g display-time 4000

# refresh status bar more often
set -g status-interval 5

# upgrade $TERM
set -g default-terminal "screen-256color"

# set default term command
set -g default-command "$SHELL"

# emacs key bindings in tmux command prompt (prefix + :) are better than
# vim bindings, even for vim users.
set -g status-keys emacs

# focus events enabled for terminals that support them
set -g focus-events on

# easier and faster switching between windows in a session
bind C-p previous-window
bind C-n next-window

run '~/.local/share/dabs-repos/tpm/tpm'

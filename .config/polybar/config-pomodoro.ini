# ── Pomodoro Timer Configuration ──
# All settings are optional. Defaults are defined in pomodoro.sh.
# To override a default, uncomment the line and set your value.

# Timer durations (in minutes)
#focus_duration_minutes=20
#short_pause_duration_minutes=5
#long_pause_duration_minutes=15

# Number of focus+short_pause cycles before a long pause
#cycles_until_long_pause=4

# Emojis for each state/phase
#emoji_stopped=⏹️
#emoji_paused=⏸️
#emoji_focus=🧠
#emoji_short_pause=🍵
#emoji_long_pause=💤
#emoji_awaiting=🔔

# Texts shown in certain states
#text_stopped=Stopped
#text_awaiting=Ready?

# Colors (hex, used in polybar %{F#hex} formatting tags)
#color_stopped=#D79921
#color_running=#A89984
#color_paused=#D79921
#color_awaiting=#D79921
#color_menu_dot=#A89984
